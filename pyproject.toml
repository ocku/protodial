[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "protodial"
dynamic = ["version"]
description = "Call gRPC services from the command line using reflection or local proto files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "grpc", "protobuf", "reflection", "rpc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=42",
    "grpcio>=1.62",
    "grpcio-reflection>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=7",
    "googleapis-common-protos>=1.63",
]

[project.urls]
Repository = "https://github.com/ocku/protodial"
Issues = "https://github.com/ocku/protodial/issues"

[project.scripts]
protodial = "protodial.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.version]
path = "src/protodial/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/protodial"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.pyright]
include = ["src", "typing_tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
strict = ["src/protodial"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
# Google Python style defaults to 80 columns. Generated protobuf code is never
# stored in this repository, so the limit applies to all checked-in Python.
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["D100", "D101", "D102", "D103", "D104", "E4", "E501", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]
