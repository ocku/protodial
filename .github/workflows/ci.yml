name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m venv /tmp/protodial-wheel-smoke
          /tmp/protodial-wheel-smoke/bin/pip install dist/*.whl
          /tmp/protodial-wheel-smoke/bin/protodial --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t protodial:test .
      - run: docker run --rm protodial:test --version
      - run: test "$(docker run --rm --entrypoint id protodial:test -u)" = "10001"
